[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenledger"
version = "0.9.0"
description = "tokenLedger — attribute LLM API spend to PRs, branches, and work contexts"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
]

[project.optional-dependencies]
proxy = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]

[tool.setuptools.package-data]
tokenledger = ["web/static/*.html"]

[project.scripts]
tokenledger = "tokenledger.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
