<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tokenLedger</title>
  <script>
    (function() {
      const t = localStorage.getItem('tl-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root[data-theme="dark"] {
      --bg:           #0e131a;
      --bg-raised:    #131b24;
      --surface:      #19232f;
      --surface-2:    #1f2d3d;
      --border:       #253347;
      --border-subtle:#1b2a3a;
      --text:         #dce8f5;
      --text-muted:   #6e8ca8;
      --text-subtle:  #3d576e;
      --accent:       #4a90d9;
      --accent-dim:   rgba(74,144,217,0.12);
      --accent-dimmer:rgba(74,144,217,0.06);
      --green:        #38c78a;
      --green-dim:    rgba(56,199,138,0.10);
      --amber:        #e8a84c;
      --shadow-sm:    0 1px 2px rgba(0,0,0,0.3);
    }
    :root[data-theme="light"] {
      --bg:           #eaf0f8;
      --bg-raised:    #f0f5fb;
      --surface:      #ffffff;
      --surface-2:    #f5f8fc;
      --border:       #d0dae8;
      --border-subtle:#e3eaf4;
      --text:         #1a2638;
      --text-muted:   #55718f;
      --text-subtle:  #9ab0c8;
      --accent:       #2370be;
      --accent-dim:   rgba(35,112,190,0.08);
      --accent-dimmer:rgba(35,112,190,0.04);
      --green:        #0d9e68;
      --green-dim:    rgba(13,158,104,0.08);
      --amber:        #c47d0a;
      --shadow-sm:    0 1px 2px rgba(0,0,0,0.06);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.6;
    }

    header {
      height: 52px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-raised);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .wordmark { font-size: 15px; font-weight: 700; letter-spacing: -0.03em; color: var(--text); }
    .wordmark span { color: var(--accent); }
    header .spacer { flex: 1; }
    .header-meta { display: flex; align-items: center; gap: 12px; }
    .live-pill {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--text-muted);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 10px;
    }
    .live-dot { width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; display:inline-block; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .theme-btn {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text-muted);
      cursor: pointer; font-size: 14px; padding: 4px 8px; line-height: 1;
      transition: color .15s, background .15s;
    }
    .theme-btn:hover { color: var(--text); background: var(--surface-2); }

    main { padding: 24px; max-width: 1240px; margin: 0 auto; }

    .breadcrumb { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
    .breadcrumb a { color: var(--text-muted); }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb sep { margin: 0 6px; opacity: .4; }

    .ctx-header { margin-bottom: 20px; }
    .ctx-name { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; margin-bottom: 6px; }
    .ctx-meta { display: flex; gap: 14px; align-items: center; color: var(--text-muted); font-size: 12px; flex-wrap: wrap; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; box-shadow: var(--shadow-sm); }
    .card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 10px; }
    .card-value { font-size: 24px; font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }

    .chart-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
    .chart-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 16px; }
    .chart-box canvas { max-height: 200px; }

    .table-header { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 10px; }
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-sm); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 9px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); background: var(--surface-2); border-bottom: 1px solid var(--border); }
    td { padding: 10px 16px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--accent-dimmer); }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .mono { font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 12px; font-variant-numeric: tabular-nums; }
    .cost { color: var(--green); font-weight: 600; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 12px; }
    .text-muted { color: var(--text-muted); }

    .badge-source { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; letter-spacing: 0.04em; }
    .badge-git    { background: var(--accent-dim); color: var(--accent); }
    .badge-manual { background: rgba(232,168,76,0.12); color: var(--amber); }
    .model-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--accent-dim); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="wordmark">token<span>ledger</span></div>
    <div class="spacer"></div>
    <div class="header-meta">
      <div class="live-pill">
        <div class="live-dot"></div>
        <span id="last-updated">loading</span>
      </div>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">☀</button>
    </div>
  </header>

  <main>
    <div class="breadcrumb">
      <a href="/">Dashboard</a>
      <sep>/</sep>
      <span id="ctx-name-crumb">context</span>
    </div>

    <div class="ctx-header">
      <div class="ctx-name" id="ctx-name">—</div>
      <div class="ctx-meta">
        <span id="ctx-source"></span>
        <span id="ctx-started"></span>
        <span id="ctx-ended"></span>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-label">Total cost</div>
        <div class="card-value cost" id="stat-cost">—</div>
      </div>
      <div class="card">
        <div class="card-label">Calls</div>
        <div class="card-value" id="stat-calls">—</div>
      </div>
      <div class="card">
        <div class="card-label">Input tokens</div>
        <div class="card-value" id="stat-in">—</div>
      </div>
      <div class="card">
        <div class="card-label">Output tokens</div>
        <div class="card-value" id="stat-out">—</div>
      </div>
    </div>

    <div class="chart-box">
      <div class="chart-label">Cumulative spend</div>
      <canvas id="chart-timeline"></canvas>
    </div>

    <div class="table-header">Call log</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Time</th>
            <th>Model</th>
            <th style="text-align:right">Input</th>
            <th style="text-align:right">Output</th>
            <th style="text-align:right">Cost</th>
          </tr>
        </thead>
        <tbody id="calls-tbody">
          <tr><td colspan="6" style="color:var(--text-muted);text-align:center;padding:32px">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

<script>
function toggleTheme() {
  const cur  = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('tl-theme', next);
  document.getElementById('theme-btn').textContent = next === 'dark' ? '☀' : '☾';
  if (tlChart) {
    const c = chartColors();
    ['x','y'].forEach(ax => {
      tlChart.options.scales[ax].ticks.color = c.tick;
      tlChart.options.scales[ax].grid.color  = c.grid;
    });
    tlChart.update();
  }
}
document.getElementById('theme-btn').textContent =
  (document.documentElement.getAttribute('data-theme') === 'dark') ? '☀' : '☾';

const contextId = parseInt(location.pathname.split('/').pop());
const fmt = {
  cost:  v => `$${(v||0).toFixed(4)}`,
  num:   v => (v||0).toLocaleString(),
  short: v => { if(v>=1e6) return `${(v/1e6).toFixed(1)}M`; if(v>=1e3) return `${(v/1e3).toFixed(1)}K`; return String(v||0); },
};
const shortModel = m => m.includes('opus')?'opus':m.includes('sonnet')?'sonnet':m.includes('haiku')?'haiku':m;

function chartColors() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  return { grid: dark ? '#1d2e3e' : '#e0e9f3', tick: dark ? '#4a6880' : '#7a9ab8' };
}

let tlChart = null;
let headerLoaded = false;

async function refresh() {
  const d = await fetch(`/api/contexts/${contextId}`).then(r => r.json());
  const { context: ctx, totals, calls } = d;

  if (!headerLoaded) {
    document.title = `tokenLedger — ${ctx.name}`;
    document.getElementById('ctx-name').textContent       = ctx.name;
    document.getElementById('ctx-name-crumb').textContent = ctx.name;
    document.getElementById('ctx-source').innerHTML =
      `<span class="badge-source badge-${ctx.source}">${ctx.source}</span>`;
    document.getElementById('ctx-started').textContent =
      `started ${ctx.started_at.slice(0,16).replace('T',' ')}`;
    headerLoaded = true;
  }
  document.getElementById('ctx-ended').textContent =
    ctx.ended_at ? `ended ${ctx.ended_at.slice(0,16).replace('T',' ')}` : 'active';

  document.getElementById('stat-cost').textContent  = fmt.cost(totals.total_cost);
  document.getElementById('stat-calls').textContent = fmt.num(totals.call_count);
  document.getElementById('stat-in').textContent    = fmt.short(totals.total_input_tokens);
  document.getElementById('stat-out').textContent   = fmt.short(totals.total_output_tokens);

  if (calls.length) {
    let running = 0;
    const labels = calls.map((_, i) => `#${i+1}`);
    const data   = calls.map(c => { running += (c.total_cost||0); return +running.toFixed(6); });
    const c = chartColors();
    if (tlChart) {
      tlChart.data.labels = labels;
      tlChart.data.datasets[0].data = data;
      tlChart.update();
    } else {
      tlChart = new Chart(document.getElementById('chart-timeline'), {
        type: 'line',
        data: { labels, datasets: [{ label: 'Cumulative ($)', data,
          borderColor: '#4a90d9', backgroundColor: 'rgba(74,144,217,0.07)',
          fill: true, tension: 0.3, pointRadius: 2.5, borderWidth: 2 }] },
        options: {
          responsive: true, maintainAspectRatio: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: c.tick, maxTicksLimit: 12, font: { size: 11 } }, grid: { color: c.grid } },
            y: { ticks: { color: c.tick, callback: v => `$${v.toFixed(3)}`, font: { size: 11 } }, grid: { color: c.grid }, beginAtZero: true },
          },
        },
      });
    }
  }

  const tbody = document.getElementById('calls-tbody');
  tbody.innerHTML = calls.length
    ? calls.map((c, i) => `<tr>
        <td class="mono text-muted">${i+1}</td>
        <td class="mono text-muted">${c.timestamp.slice(0,19).replace('T',' ')}</td>
        <td><span class="model-tag">${shortModel(c.model)}</span></td>
        <td class="mono text-muted" style="text-align:right">${fmt.num(c.input_tokens||0)}</td>
        <td class="mono text-muted" style="text-align:right">${fmt.num(c.output_tokens||0)}</td>
        <td class="cost" style="text-align:right">${fmt.cost(c.total_cost)}</td>
      </tr>`).join('')
    : '<tr><td colspan="6" style="color:var(--text-muted);text-align:center;padding:32px">No calls recorded.</td></tr>';

  const t = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('last-updated').textContent = t;
}

refresh();
setInterval(refresh, 30_000);
</script>
</body>
</html>
